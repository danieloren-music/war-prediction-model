<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מודל חיזוי עימותים - מבוסס AI ורגרסיה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            min-height: 30px;
        }
        .stats {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>מודל חיזוי עימותים חכם</h1>
        <p>מתבסס על רגרסיה ליניארית וניתוח היסטורי של מערכות ישראל מ-1948 ועד 2026 (כולל זירות איראן)</p>
        
        <button onclick="runPrediction()">הפעל חישוב מודל</button>
        
        <div id="result"></div>
        <div id="stats" class="stats"></div>
    </div>

    <script>
        async function runPrediction() {
            const resultDiv = document.getElementById('result');
            const statsDiv = document.getElementById('stats');
            
            resultDiv.innerHTML = "מריץ רגרסיה וקורא נתונים מ-Supabase...";
            statsDiv.innerHTML = "";

            try {
                const response = await fetch('/api/predict');
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `תאריך החיזוי לעימות הבא: ${data.predicted_date}`;
                    statsDiv.innerHTML = `נתונים שנוחו: ${data.total_events_analyzed} אירועים היסטוריים | מרווח ממוצע: ${data.mean_interval} שנים`;
                } else {
                    resultDiv.innerHTML = "שגיאה בחישוב המודל";
                }
            } catch (error) {
                resultDiv.innerHTML = "שגיאת תקשורת מול השרת";
                console.error(error);
            }
        }
    </script>

</body>
</html>
